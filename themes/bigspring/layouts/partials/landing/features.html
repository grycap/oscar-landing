{{ with .Params.feature }}
{{ if .enable }}
<section class="section landing-features" aria-labelledby="landing-features-title">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <h2 id="landing-features-title" class="section-title">{{ .title | markdownify }}</h2>
      </div>
    </div>

    <div class="row">
      {{ range .feature_item }}
      <div class="col-md-6 col-lg-4 d-flex mb-4">
        <article class="feature-card feature-card--premium text-center w-100">
          <i class="{{ .icon }} mb-3 feature-card__icon" aria-hidden="true"></i>
          <h3 class="h5 mb-2">{{ .name | title }}</h3>
          <p class="mb-0">{{ .content | markdownify }}</p>
        </article>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
{{ end }}
